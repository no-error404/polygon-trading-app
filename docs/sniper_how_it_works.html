<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#14161a; font-family:"Helvetica Neue", Arial, sans-serif; color:#f1f3f5; }
  .title { font-size:30px; font-weight:700; color:#fff; }
  .sub { font-size:15px; color:#adb5bd; margin-top:4px; }
  .loop-tag { font-size:16px; font-weight:600; color:#ffd43b; }
</style>
</head>
<body>
<svg width="960" height="1180" viewBox="0 0 960 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrBlue"  markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1971c2"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2f9e44"/></marker>
    <marker id="arrOran" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#f76707"/></marker>
    <marker id="arrRed"  markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#e03131"/></marker>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#495057"/></marker>
  </defs>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">The Weather Betting Bot</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#adb5bd">How the sniper bot works &mdash; in plain language</text>

  <!-- STEP 0: inputs row -->
  <foreignObject x="60" y="100" width="400" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; line-height:1.4; background:#1f242b; border:2px solid #2f9e44; border-radius:12px; padding:12px; color:#d3f9d8;">
      <b style="color:#69db7c;">1. The two teams of brains</b><br>
      Weather forecast models (GFS, ECMWF, ICON) predict what the weather will do. They are the &ldquo;nerds&rdquo; who do the math.
    </div>
  </foreignObject>
  <foreignObject x="500" y="100" width="400" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; line-height:1.4; background:#1f242b; border:2px solid #a5d8ff; border-radius:12px; padding:12px; color:#d0ebff;">
      <b style="color:#74c0fc;">&hellip;and the betting crowd</b><br>
      On Polymarket, people bet on what will happen: &ldquo;Will NY hit 68&ndash;69&deg;F on Jul 12?&rdquo; Their bets create a price that = everyone&rsquo;s guess.
    </div>
  </foreignObject>

  <!-- arrow model -> compare -->
  <line x1="260" y1="220" x2="260" y2="280" stroke="#2f9e44" stroke-width="4" marker-end="url(#arrGreen)"/>
  <line x1="700" y1="220" x2="700" y2="280" stroke="#1971c2" stroke-width="4" marker-end="url(#arrBlue)"/>

  <!-- STEP 1: compare -->
  <foreignObject x="180" y="290" width="600" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.45; background:#2b2720; border:2px solid #ffd43b; border-radius:12px; padding:14px; color:#fff3bf;">
      <b style="color:#ffd43b;">2. Spot the disagreement</b><br>
      The bot compares the two. If the models say &ldquo;70% chance of snow&rdquo; but the crowd&rsquo;s price says &ldquo;50%&rdquo; &mdash; the crowd is wrong and there&rsquo;s <b style="color:#ffd43b;">edge</b> (a bargain).
    </div>
  </foreignObject>

  <line x1="480" y1="240" x2="330" y2="290" stroke="#495057" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>
  <line x1="480" y1="240" x2="630" y2="290" stroke="#495057" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>

  <line x1="480" y1="400" x2="480" y2="470" stroke="#f76707" stroke-width="4" marker-end="url(#arrOran)"/>

  <!-- STEP 2: decide price -->
  <foreignObject x="240" y="480" width="480" height="105">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.45; background:#242b26; border:2px solid #2f9e44; border-radius:12px; padding:14px; color:#d3f9d8;">
      <b style="color:#69db7c;">3. Calculate the bet (the Kelly formula)</b><br>
      The bot works out how much to risk using a formula called <b>Kelly</b>. When it&rsquo;s more confident &mdash; bigger bet. When models disagree &mdash; smaller bet. It also caps each bet so one bad guess can&rsquo;t wipe it out.
    </div>
  </foreignObject>

  <line x1="480" y1="585" x2="480" y2="650" stroke="#2f9e44" stroke-width="4" marker-end="url(#arrGreen)"/>

  <!-- STEP 3: place order -->
  <foreignObject x="240" y="660" width="480" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.45; background:#201f1f; border:2px solid #f8c9c9; border-radius:12px; padding:14px; color:#ffc9c9;">
      <b style="color:#ff8787;">4. Place the bet</b><br>
      It puts in a <b>limit order</b> (only buys at a good price, never overpays) on Polymarket. <span style="color:#ffc9c9;">DRY RUN</span> = plays pretend with no real money and keeps a score sheet. <span style="color:#ffc9c9;">LIVE</span> = real money.
    </div>
  </foreignObject>

  <line x1="480" y1="760" x2="480" y2="825" stroke="#1971c2" stroke-width="4" marker-end="url(#arrBlue)"/>

  <!-- STEP 4: outcome -->
  <foreignObject x="240" y="835" width="480" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px; line-height:1.45; background:#24242b; border:2px solid #d0bfff; border-radius:12px; padding:14px; color:#e5dbff;">
      <b style="color:#b197fc;">5. Did it win?&nbsp;</b>
      The weather happens. If the bet wins, the bot bankroll grows. If it loses, it shrinks. It records the result and remembers which guesses were right.
    </div>
  </foreignObject>

  <!-- loop back arrow -->
  <path d="M 60 885 L 40 885 L 40 240" stroke="#f76707" stroke-width="4" fill="none" marker-end="url(#arrOran)"/>
  <text x="40" y="560" font-size="15" font-weight="600" fill="#ffd43b" transform="rotate(-90 40 560)" text-anchor="middle">LOOP &mdash; repeats every 5 minutes</text>

  <!-- safety net -->
  <foreignObject x="720" y="480" width="210" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; line-height:1.4; background:#171a1f; border:2px solid #e03131; border-radius:12px; padding:12px; color:#ffc9c9;">
      <b style="color:#ff8787;">Seatbelt: the kill switch</b><br>
      If the bankroll drops too much in a day, the bot <b>stops trading automatically</b> instead of chasing losses. It is the rule that protects the money from the bot&rsquo;s own overconfidence.
    </div>
  </foreignObject>
  <line x1="720" y1="560" x2="480" y2="560" stroke="#e03131" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrRed)"/>

  <!-- footer -->
  <text x="480" y="1010" text-anchor="middle" font-size="14" fill="#868e96">The bot is basically: forecast models do the math, the bot shops for a price that disagrees with them, and it bets small when unsure.</text>
  <text x="480" y="1036" text-anchor="middle" font-size="14" fill="#868e96">No one can predict weather perfectly &mdash; it never bets more than it can afford to lose, and practice runs use fake money.</text>

  <!-- bottom small diagram: dry vs live -->
  <line x1="480" y1="1060" x2="480" y2="1090" stroke="#495057" stroke-width="3"/>
  <foreignObject x="130" y="1100" width="330" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; line-height:1.3; background:#18241a; border:2px solid #2f9e44; border-radius:10px; padding:10px; color:#b2f2bb;">
      <b style="color:#69db7c;">DRY RUN</b> &mdash; fake money, real process. This is the &ldquo;flight simulator&rdquo; before ever risking cash.
    </div>
  </foreignObject>
  <foreignObject x="500" y="1100" width="330" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; line-height:1.3; background:#241a1a; border:2px solid #e03131; border-radius:10px; padding:10px; color:#ffc9c9;">
      <b style="color:#ff8787;">LIVE</b> &mdash; real money, and the bot must pass 100 dry-run cycles + 10 test orders before it&rsquo;s even allowed to place one real trade.
    </div>
  </foreignObject>
</svg>
</body>
</html>
