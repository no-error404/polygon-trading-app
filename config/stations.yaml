# ============================================================================
# Station Lookup Table — ICAO code to coordinates and metadata
# ============================================================================
# CRITICAL: Polymarket weather markets resolve against a NAMED AIRPORT STATION
# via Wunderground history, NOT a city centroid. The station is parsed from
# the market description text (e.g. "LaGuardia Airport Station" → KLGA).
#
# This table maps ICAO codes to their exact coordinates for forecast queries.
# Coordinates are the official station locations, NOT city centres.
# ============================================================================

stations:
  # --- US stations (Fahrenheit) ---
  KLGA:
    name: "LaGuardia Airport"
    city: "New York City"
    country: "US"
    lat: 40.777
    lon: -73.873
    elevation_m: 6
    units: "F"
    wunderground_path: "us/ny/new-york-city/KLGA"

  KJFK:
    name: "John F Kennedy Intl Airport"
    city: "New York City"
    country: "US"
    lat: 40.640
