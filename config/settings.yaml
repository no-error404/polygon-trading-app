# ============================================================================ 
# Polymarket Weather Trader — Global Settings 
# ============================================================================
apis:
  gamma: "https://gamma-api.polymarket.com"
  clob:  "https://clob.polymarket.com"
  data:  "https://data-api.polymarket.com"
  open_meteo: "https://api.open-meteo.com/v1/forecast"
  open_meteo_ensemble: "https://ensemble-api.open-meteo.com/v1/ensemble"

weather_models:
  - gfs_seamless
  - ecmwf_ifs025
  - icon_seamless

trading:
  deposit_wallet: "0x157F0453492B326DC3E995DC3C898768184Ee6d9"
  bankroll_usdc: 5.0
  kelly_fraction: 0.25
  single_market_cap: 0.10
  aggregate_cap: 0.25
  ev_threshold: 0.02
  limit_price_fraction: 0.97
  max_hours_to_resolution: 48
  min_ask_depth_shares: 1
  min_trade_dollars: 1.00
  p_model_clip_min: 0.01
  p_model_clip_max: 0.99
  min_ensemble_runs: 30
  max_slippage_bps: 200
  order_type: "GTC"
  min_models: 2

soak:
  poll_interval_seconds: 300
  dry_run: false
  max_cycles: 0
  log_path: "logs/soak_audit.jsonl"

discovery:
  search_queries:
    - "highest temperature"
    - "july temperature"
    - "snowfall"
    - "rainfall"
    - "wind speed"
    - "humidity"
  poll_interval_seconds: 600
  min_event_volume: 5000

risk:
  drawdown_kill_pct: 0.08
  max_consecutive_rejections: 3
  max_api_failures: 3
  reconcile_bankroll_every_n_cycles: 12

network:
  chain_id: 137
  rpc_url: "https://polygon-rpc.com"
